<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saved items - Luxora</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/palette.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/saved.css">
</head>
<body>
<header class="top">
  <div class="wrap top__in">
    <a href="index.html" class="logo" aria-label="Luxora home"><span data-logo class="logo__mark"></span>Luxora</a>
    <nav class="top__nav" aria-label="Primary">
      <a href="shop.html">Shop</a>
      <a href="saved.html" class="on" aria-current="page">Saved <b class="badge" data-saved-badge hidden>0</b></a>
      <a href="app.html">AI Assistant</a>
      <a href="shop.html#cart">Cart <b class="badge" data-cart-badge hidden>0</b></a>
    </nav>
  </div>
</header>

<main class="wrap saved">
  <div class="saved__head">
    <div><p class="eyebrow">Your favorites</p><h1>Saved items</h1></div>
    <div class="saved__actions"><button class="btn btn--sm" id="moveAll" hidden>Move all to cart</button><a href="shop.html" class="btn btn--ghost btn--sm">&#8592; Continue shopping</a></div>
  </div>
  <section class="lines" id="lines" aria-label="Saved items"></section>
  <p class="demo-note">Luxora is a prototype with sample products. Nothing here is a real product and no payment is ever taken.</p>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/art.js"></script>
<script src="js/offline.js"></script>
<script src="js/store.js"></script>
<script src="js/saved.js"></script>
</body>
</html>
